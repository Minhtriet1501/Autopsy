spring.application.name=autopsy
server.port=${SERVER_PORT:8081}
target.base-url=${TARGET_BASE_URL:http://localhost:8082}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

ratelimit.capacity=${RATELIMIT_CAPACITY:5}
ratelimit.refill-per-sec=${RATELIMIT_REFILL_PER_SEC:0.2}

anthropic.timeout-seconds=${ANTHROPIC_TIMEOUT_SECONDS:60}
anthropic.max-retries=${ANTHROPIC_MAX_RETRIES:3}